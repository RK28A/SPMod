name: Build check

on:
  workflow_dispatch:
  push:
    branches: [main, patch-v2]
    paths:
      - "tweak/**"
      - "extension/LiveActivity/**"
      - "scripts/check-layers.sh"
      - ".github/workflows/build-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  tweak:
    name: Compile tweak
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: brew install make dpkg ldid

      - name: Check import layering
        run: bash scripts/check-layers.sh || true

      - name: Build tweak
        run: env -u MAKELEVEL gmake -C tweak clean package

      # The widget only builds with the IPA otherwise (scripts/build-extension.sh): its sources are checked here.
      - name: Typecheck the Live Activity widget
        run: |
          xcrun --sdk iphoneos swiftc -typecheck -wmo -parse-as-library -target arm64-apple-ios17.0 \
            -module-name SpotifyGlassLiveActivity \
            tweak/Sources/Shared/LiveActivity/LiveActivityShared.swift extension/LiveActivity/LiveActivityWidget.swift
