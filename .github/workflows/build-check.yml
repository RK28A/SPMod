name: Build check

# A macOS minute costs ten of a free plan's, so this runs when asked and not on every push: by hand, or for a
# push whose last commit says [check]. Theos and its SDKs are kept between runs, and a newer push cancels the
# run before it.

on:
  workflow_dispatch:
  push:
    branches: [main, patch-v2]
    paths:
      - "tweak/**"
      - "extension/LiveActivity/**"
      - "scripts/check-layers.sh"
      - ".github/workflows/build-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  tweak:
    name: Compile tweak
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[check]')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Theos, kept between runs
        id: theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-${{ runner.os }}-v1

      - uses: actions/checkout@v5
        if: steps.theos.outputs.cache-hit != 'true'
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install make dpkg ldid

      - name: Check import layering
        run: bash scripts/check-layers.sh || true

      - name: Build tweak
        run: env -u MAKELEVEL gmake -C tweak package

      # The widget only builds with the IPA otherwise (scripts/build-extension.sh): its sources are checked here.
      - name: Typecheck the Live Activity widget
        run: |
          xcrun --sdk iphoneos swiftc -typecheck -wmo -parse-as-library -target arm64-apple-ios17.0 \
            -module-name SpotifyGlassLiveActivity \
            tweak/Sources/Shared/LiveActivity/LiveActivityShared.swift extension/LiveActivity/LiveActivityWidget.swift
