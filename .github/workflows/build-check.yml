name: Build check

on:
  workflow_dispatch:
  push:
    branches: [main, better-SPMod]
    paths:
      - "Sources/**"
      - "Makefile"
      - "control"
      - "layout/**"
      - ".github/workflows/build-check.yml"

concurrency:
  group: build-check
  cancel-in-progress: true

env:
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          {
            framework="$(bash src/tools/build_swiftprotobuf.sh "$SWIFTPROTOBUF_VERSION" "$PWD" | tail -1)"
            cp -R "$framework" "$THEOS/lib/"
            cd src
            make clean package FINALPACKAGE=1
          } 2>&1 | tee build.log

      - name: Publish log
        if: always()
        working-directory: src
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          {
            echo "commit: ${GITHUB_SHA}"
            echo "outcome: ${OUTCOME}"
            echo "xcode: $(xcodebuild -version | head -1)"
            echo "---- errors ----"
            grep -nE "error:|fatal error|ld: |Undefined symbols|cannot find|\*\*\*" ../build.log | head -300 || true
            echo "---- tail ----"
            tail -150 ../build.log
          } > ../ci-log.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch --depth 1 origin ci-logs || true
          git switch --orphan ci-logs-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp ../ci-log.txt build.log
          git add build.log
          git commit -m "Build log ${GITHUB_SHA}"
          git push -f origin HEAD:ci-logs

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
