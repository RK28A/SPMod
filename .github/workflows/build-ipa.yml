name: Build SPMod IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      runner:
        description: "Mac to build on (ARM runners are often full)"
        default: intel
        type: choice
        options: [intel, arm]
      upload_method:
        description: "Where to put the result"
        default: both
        type: choice
        options: [artifacts, filebin, both]

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    # Both are macOS 26: the alternate app icons need its asset tools.
    runs-on: ${{ inputs.runner == 'arm' && 'macos-26' || 'macos-26-intel' }}
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        run: |
          mkdir -p ipa
          curl -fsSL "${{ inputs.ipa_url }}" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - run: make release

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: SPMod.ipa
          path: out/*.ipa
          if-no-files-found: error

      # filebin is a free host that fills up (507) or goes down: a failure there is said, never fatal.
      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        continue-on-error: true
        run: |
          BIN="spmod-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            if curl -fsS --retry 2 --retry-delay 5 -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null; then
              echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- filebin refused the upload: use the artifact or the release." >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::filebin.net refused the upload; the IPA is in the artifact and the release"
            fi
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"

      # The build as the latest release, numbered 6.1.N where N counts the releases, this one included.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="$(gh api "repos/${{ github.repository }}/releases" --paginate -q '.[].id' | wc -l | tr -d ' ')"
          NUMBER=$((COUNT + 1))
          while gh api "repos/${{ github.repository }}/git/ref/tags/v6.1.$NUMBER" >/dev/null 2>&1; do NUMBER=$((NUMBER + 1)); done
          VERSION="6.1.$NUMBER"
          cp out/SPMod.ipa "out/SPMod-$VERSION.ipa"
          gh release create "v$VERSION" "out/SPMod-$VERSION.ipa" --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "SPMod $VERSION" --latest \
            --notes "Built from \`${{ github.ref_name }}\` at ${GITHUB_SHA::7}. Unsigned: sign it with SideStore, Feather or any certificate signer."
          echo "### Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://github.com/${{ github.repository }}/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
